<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Atlante — Galaxia Live</title>
<meta name="theme-color" content="#2b2b2b">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' fill='%236b4a2a'/%3E%3Crect width='16' height='6' fill='%235fa839'/%3E%3Crect y='6' width='16' height='2' fill='%234a7a2a'/%3E%3C/svg%3E">
<link rel="stylesheet" href="../vendor/leaflet.css">
<link rel="stylesheet" href="../css/textures.css">
<link rel="stylesheet" href="../css/style.css">
<link rel="stylesheet" href="../css/galaxia.css">
</head>
<body>

<div id="app">
  <header id="topbar">
    <div class="logo"><span class="cube"></span><span>GALAXIA<b>-LIVE</b></span></div>
    <nav class="tabs">
      <a class="tab" href="../index.html"><img class="icon-item" src="../vendor/icons/campfire.svg" alt="">Home</a>
      <a class="tab active" href="index.html"><img class="icon-item" src="../vendor/icons/map.svg" alt="">Atlante</a>
      <a class="tab" href="../archivio/index.html"><img class="icon-item" src="../vendor/icons/book.svg" alt="">Archivio</a>
    </nav>
    <div class="topbar-spacer"></div>
    <div class="topbar-info" id="atlas-status"></div>
  </header>

  <div class="screen active" id="screen-atlas">
    <aside class="sidebar">
      <section class="panel">
        <h2>Atlante</h2>
        <div class="hint" id="current-atlas-label">Caricamento…</div>
        <ul class="doc-list" id="atlas-list"></ul>
        <button class="btn" id="btn-atlas-reload">↻ Ricarica elenco</button>
      </section>

      <section class="panel hidden" id="map-search-panel">
        <h2>Cerca</h2>
        <div class="hint">Nomi di vie, palazzi, stazioni e altri elementi disegnati.</div>
        <input type="text" id="atlas-search" placeholder="Cerca un elemento…">
        <ul class="doc-list hidden" id="atlas-search-results"></ul>
      </section>

      <section class="panel hidden" id="map-goto-panel">
        <h2>Vai a coordinate</h2>
        <div class="row-3">
          <label><span class="lbl">X</span><input type="number" id="goto-x" placeholder="0"></label>
          <label><span class="lbl">Z</span><input type="number" id="goto-z" placeholder="0"></label>
          <label><span class="lbl">&nbsp;</span><button class="btn btn-sm" id="btn-goto" style="margin-top:0">Vai</button></label>
        </div>
      </section>

      <section class="panel hidden" id="map-layers-panel">
        <h2>Layer</h2>
        <div class="hint">Nascondi o mostra i layer di questa mappa.</div>
        <ul class="layer-list" id="atlas-layer-list"></ul>
      </section>
    </aside>

    <main class="reader-main">
      <div class="reader-empty" id="map-empty">
        <h3>Atlante</h3>
        <p id="map-empty-msg">Caricamento…</p>
      </div>

      <div class="reader-map-view hidden" id="map-view">
        <div id="reader-map"></div>
      </div>
    </main>
  </div>
</div>

<div id="toast-host"></div>
<div id="modal-host"></div>

<script src="../vendor/leaflet.js"></script>
<script type="module" src="../js/atlas-viewer.js"></script>
</body>
</html>
